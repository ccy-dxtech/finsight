[mcp_servers.playwright]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@playwright/mcp@0.0.84",
    "--browser",
    "chrome",
    "--config",
    "playwright-mcp.config.json",
    "--isolated",
    "--output-dir",
    "test-results/browser",
]

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ENABLE_CODE_SECURITY_REVIEW = "0"
