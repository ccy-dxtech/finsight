<!-- @dsCard group="Dashboard" height=230 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>
body { margin: 0; background: var(--canvas); }
.pad { padding: var(--space-lg); }
.row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }

</style></head>
<body>
<div class="pad" style="max-width:640px"><label class="fs-drop">
  <span class="fs-drop__icon">↑</span>
  <span class="fs-drop__title">카드 명세서를 끌어다 놓거나 선택하세요</span>
  <span class="fs-drop__hint">CSV, xls, xlsx, PDF · 한 번에 한 파일 · 최대 4MB · 3,000건</span>
  <input type="file" class="fs-sr" accept=".csv,.xls,.xlsx,.pdf">
</label>
<div class="fs-card row" style="justify-content:space-between;margin-top:var(--space-base);padding:var(--space-base) var(--space-lg)">
  <span style="color:var(--muted)">선택한 파일이 없어요. 위에서 명세서를 골라 주세요.</span>
  <button class="fs-btn fs-btn--primary" disabled>분석하기</button>
</div></div>
</body>
</html>
