<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>
body { margin: 0; background: var(--canvas); }
.pad { padding: var(--space-lg); }
.row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }
body{min-width:760px}
</style></head>
<body>
<div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);max-width:760px">
  <div class="fs-tier"><div class="fs-tier__head">무료</div><div class="fs-tier__price fs-num">0원<small>/ 월</small></div>
    <ul><li>월 3회 분석</li><li>핵심 리포트 (Sonnet 5.5)</li><li class="is-off">월별 추이</li></ul>
    <button class="fs-btn fs-btn--secondary fs-btn--block">시작하기</button></div>
  <div class="fs-tier fs-tier--pro"><div class="fs-tier__head">프로 <span class="fs-badge fs-badge--pro">추천</span></div><div class="fs-tier__price fs-num">1,000원<small>/ 월</small></div>
    <ul><li>월 30회 분석</li><li>더 깊은 리포트 (Opus 5.5)</li><li>월별 추이와 카테고리 증감</li></ul>
    <button class="fs-btn fs-btn--primary fs-btn--block">프로 구독하기</button>
    <p class="fs-testnote" style="margin:0;text-align:center">테스트 결제 환경이며 실제로 청구되지 않습니다</p></div>
</div>
</body>
</html>
