<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>
body { margin: 0; background: var(--canvas); }
.pad { padding: var(--space-lg); }
.row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }
body{min-width:720px}
</style></head>
<body>
<div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);max-width:720px">
  <div class="fs-card"><div class="fs-usage__row"><span class="fs-usage__label">이번 달 남은 분석</span><span class="fs-num-lg">2<span class="fs-unit">/ 3회</span></span></div>
    <div class="fs-meter" role="meter" aria-valuenow="2" aria-valuemin="0" aria-valuemax="3"><span style="width:66.6%"></span></div><div class="fs-usage__foot">12월 1일 00:00에 다시 채워져요</div></div>
  <div class="fs-card"><div class="fs-usage__row"><span class="fs-usage__label">이번 달 남은 분석</span><span class="fs-num-lg">0<span class="fs-unit">/ 3회</span></span></div>
    <div class="fs-meter is-empty"><span style="width:0"></span></div><div class="fs-usage__foot">12월 1일 00:00에 다시 채워져요</div></div>
</div>
</body>
</html>
